# Arcane / Docker Compose: runs the prebuilt image that GitHub Actions publishes
# (.github/workflows/ascension-planner-image.yml).
# Open http://<server>:8080/ascension-planner/
services:
  ascension-planner:
    image: ghcr.io/leloberg/ascension-planner:latest
    ports:
      - "8080:80"
    restart: unless-stopped
