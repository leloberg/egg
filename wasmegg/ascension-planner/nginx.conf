server {
    listen 80;
    root /usr/share/nginx/html;

    location = / {
        return 302 /ascension-planner/;
    }

    location /ascension-planner/ {
        try_files $uri $uri/ /ascension-planner/index.html;
    }

    # Hashed build assets never change, so let browsers keep them.
    location /ascension-planner/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
