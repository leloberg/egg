name: ascension-planner-image
# Builds the Ascension Planner Docker image and publishes it to
# ghcr.io/<owner>/ascension-planner. Pushes to the default branch are tagged
# `latest`; other branches get a tag named after the branch.
on:
  push:
    paths:
      - '.github/workflows/ascension-planner-image.yml'
      - pnpm-lock.yaml
      - 'protobuf/**'
      - 'lib/**'
      - 'ui/**'
      - 'periodicals/data/**'
      - 'wasmegg/_common/**'
      - 'wasmegg/ascension-planner/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ascension-planner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ascension-planner
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: wasmegg/ascension-planner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
